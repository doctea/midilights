; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = default

[env:default]
platform = https://github.com/maxgerhardt/platform-raspberrypi
board = pimoroni_plasma2350
;board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps =  ;adafruit/Adafruit NeoPXL8
            ;adafruit/Adafruit NeoPixel
            ;Adafruit TinyUSB Library=https://github.com/doctea/Adafruit_TinyUSB_Arduino
            MIDI Library
	        vortigont/LinkedList
            Encoder
            Bounce2@^2.71
            midihelpers
	        khoih-prog/Functional-Vlpp@^1.0.2
            SimplyAtomic
            uClock
            ADS1X15

lib_extra_dirs = 
    lib
    c:\Users\doctea\Documents\Arduino\my_libraries

build_flags = 
	-DUSE_TINYUSB
	-DUSB_MIDI_VID=0x1337
	-DUSB_MIDI_PID=0x117E    ;lite, geddit?
	-DUSB_MIDI_MANUFACTURER="\"TyrellCorp\""
	-DUSB_MIDI_PRODUCT="\"MIDILights2\""
    ;-DSS=-1 ; to stop SdFat from puking on this board?
    -DENABLE_PARAMETERS
    ;-DUSE_ATOMIC
    ;-DUSE_UCLOCK
    -DENABLE_CV_INPUT=0x48
    -DPPQN=96

lib_ignore = 
    SD
    SdFat
    ESP8266SdFat
    ;parameters
    mymenu
    seqlib

upload_port = \\.\COM33
#debug_port = COM32
monitor_port = \\.\COM33